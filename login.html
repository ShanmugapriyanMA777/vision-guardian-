<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guardian Sign In - VisionAssist Guardian Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--slate-100);">

  <div style="width: 100%; max-width: 440px; padding: 20px;">
    <div style="background: var(--white); border-radius: var(--radius-lg); border: 1px solid var(--slate-200); box-shadow: var(--shadow-lg); padding: 36px;">
      
      <div style="text-align: center; margin-bottom: 28px;">
        <div style="width: 48px; height: 48px; background: var(--primary-100); color: var(--primary-700); border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <h2 style="font-size: 22px; font-weight: 800; color: var(--slate-900);">Guardian Sign In</h2>
        <p style="font-size: 13px; color: var(--slate-500); margin-top: 4px;">VisionAssist Authorized Safety Portal</p>
      </div>

      <div id="auth-message" style="font-size: 13px; font-weight: 600; text-align: center; margin-bottom: 16px; color: var(--primary-600);"></div>

      <form id="login-form" style="display: flex; flex-direction: column; gap: 16px;">
        <div>
          <label style="display: block; font-size: 12px; font-weight: 700; color: var(--slate-700); margin-bottom: 6px;">Guardian Email</label>
          <input type="email" id="email" value="sarah.connor@guardian.com" required style="width: 100%; padding: 12px; border-radius: var(--radius-md); border: 1px solid var(--slate-300); font-size: 14px;">
        </div>

        <div>
          <label style="display: block; font-size: 12px; font-weight: 700; color: var(--slate-700); margin-bottom: 6px;">Password</label>
          <input type="password" id="password" value="GuardianPass123!" required style="width: 100%; padding: 12px; border-radius: var(--radius-md); border: 1px solid var(--slate-300); font-size: 14px;">
        </div>

        <button type="submit" class="btn btn-primary" style="padding: 12px; width: 100%; font-size: 15px; margin-top: 8px;">
          Sign In to Portal
        </button>
      </form>

      <div style="margin-top: 24px; text-align: center; font-size: 13px; color: var(--slate-500); border-top: 1px solid var(--slate-200); padding-top: 16px;">
        <span>Quick Demo Access?</span>
        <a href="dashboard.html" style="font-weight: 700; margin-left: 6px;">Enter Demo Dashboard →</a>
      </div>
    </div>
  </div>

</body>
</html>
